<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Malam Fatikhil</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #020107 0%, #201b46 100%);
            color: white;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            z-index: 10;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            animation: fadeIn 2.5s ease-out;
        }

        #tap-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            z-index: 100;
            animation: pulse 2s infinite;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: #ff9a9e;
            text-shadow: 0 0 20px rgba(255, 154, 158, 0.5);
        }

        p {
            font-size: 1.2rem;
            font-weight: 300;
            line-height: 1.6;
        }

        .signature {
            margin-top: 30px;
            font-style: italic;
            font-weight: 500;
            color: #fad0c4;
        }

        /* Animasi Bintang */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Animasi Bintang Jatuh */
        .shooting-star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: linear-gradient(90deg, white, transparent);
            animation: shoot var(--duration) linear infinite;
            opacity: 0;
        }

        @keyframes shoot {
            0% { transform: translateX(0) translateY(0) rotate(-45deg) scale(0); opacity: 0; }
            10% { opacity: 1; scale(1); }
            70% { opacity: 1; }
            100% { 
                transform: translateX(-1000px) translateY(1000px) rotate(-45deg) scale(1); 
                opacity: 0; 
            }
        }

        /* Animasi Hati Berterbangan */
        .heart {
            position: absolute;
            color: #ff4b2b;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 5;
            animation: floatUp var(--duration) ease-in forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .moon {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #fefcd7);
            border-radius: 50%;
            box-shadow: 0 0 60px 10px rgba(254, 252, 215, 0.4);
        }
    </style>
</head>
<body>

    <!-- Musik Latar -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://docs.google.com/uc?id=1E3_T-v0jrCTlkhxrdMQ123vhNE0yB7rc" type="audio/mpeg">
    </audio>

    <div id="tap-hint">Sentuh di mana saja untuk memulai ❤️</div>

    <div class="moon"></div>
    
    <div class="container">
        <h1 id="type-h1"></h1>
        <p id="type-p1"></p>
        <p id="type-p2"></p>
        <div id="type-sig" class="signature"></div>
    </div>

    <script>
        // Membuat bintang secara acak
        function createStars() {
            const count = 150;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 'px';
                star.style.width = size;
                star.style.height = size;
                star.style.top = Math.random() * 100 + 'vh';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                document.body.appendChild(star);
            }
        }

        // Membuat bintang jatuh
        function createShootingStar() {
            const star = document.createElement('div');
            star.className = 'shooting-star';
            star.style.top = Math.random() * 50 + 'vh';
            star.style.left = (Math.random() * 100 + 50) + 'vw';
            star.style.setProperty('--duration', (Math.random() * 2 + 3) + 's');
            document.body.appendChild(star);
            setTimeout(() => {
                star.remove();
            }, 5000);
        }

        // Membuat efek hati berterbangan
        function createHearts() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.setProperty('--duration', (Math.random() * 3 + 4) + 's');
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // Fungsi efek mengetik
        function typeWriter(id, text, speed) {
            return new Promise(resolve => {
                let i = 0;
                const element = document.getElementById(id);
                function type() {
                    if (i < text.length) {
                        let char = text.charAt(i);
                        // Gunakan '|' sebagai penanda pindah baris (line break)
                        if (char === '|') {
                            element.innerHTML += '<br>';
                        } else {
                            element.innerHTML += char;
                        }
                        i++;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        // Fungsi untuk memutar musik setelah interaksi pertama
        async function playMusic() {
            const music = document.getElementById('bgMusic');
            const hint = document.getElementById('tap-hint');
            
            if (hint) hint.remove(); // Hapus tulisan instruksi
            
            // Mulai mengetik teks segera setelah interaksi
            startTyping();

            // Paksa pemuatan ulang dan putar musik
            music.load();
            music.play().catch(error => {
                console.log("Musik gagal diputar:", error);
            });

            // Hapus listener setelah musik berhasil diputar
            document.removeEventListener('click', playMusic);
            document.removeEventListener('touchstart', playMusic);
        }

        // Urutan kemunculan teks
        async function startTyping() {
            await typeWriter("type-h1", "Selamat Malam, sayang ❤️", 150);
            await typeWriter("type-p1", "Hari ini mungkin melelahkan, | tapi ingatlah ada aku yang selalu mendukungmu.", 80);
            await typeWriter("type-p2", "Semoga mimpi indah dan istirahat yang cukup ya.", 80);
            await typeWriter("type-sig", "joefany&gamalia", 120);
        }

        document.addEventListener('click', playMusic);
        document.addEventListener('touchstart', playMusic);

        createStars();
        setInterval(createHearts, 500);
        setInterval(createShootingStar, 3000);
    </script>
</body>
</html>
